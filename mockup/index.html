<!DOCTYPE html>
<html lang="en" dir="ltr" data-mode="light" data-preset="slate" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petrel — UI mockup</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script>
  // Apply saved appearance before first paint (no flash).
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('petrel-mockup') || '{}');
      var d = document.documentElement, m = p.mode || 'system';
      if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      d.dataset.mode = m;
      d.dataset.preset = p.preset || 'slate';
      d.dataset.density = p.density || 'comfortable';
      if (p.accent) d.style.setProperty('--accent', p.accent);
      if (p.lang) d.lang = p.lang;
      d.dir = p.rtl ? 'rtl' : 'ltr';
    } catch (e) {}
  })();
</script>
<style>
/* ───────────── Tokens ───────────── */
:root {
  --accent: #3b6cf6;
  --accent-fg: #fff;
  --radius: 16px;
  --sidebar-w: 256px;
  --list-w: 420px;
  --list-h: 44%;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --star: #f5a524;
  --danger: #e5484d;
  --accent-soft: color-mix(in oklab, var(--accent) 13%, var(--surface));
  --accent-softer: color-mix(in oklab, var(--accent) 7%, var(--surface));
  --accent-ink: color-mix(in oklab, var(--accent) 88%, var(--text));
  --focus: color-mix(in oklab, var(--accent) 55%, transparent);
}
[data-mode=dark] {
  --accent-soft: color-mix(in oklab, var(--accent) 24%, var(--surface));
  --accent-softer: color-mix(in oklab, var(--accent) 12%, var(--surface));
  --accent-ink: color-mix(in oklab, var(--accent) 62%, white);
  color-scheme: dark;
}

/* Presets × mode */
[data-preset=slate]  { --bg:#eef1f5; --surface:#fff;    --surface-2:#f5f7fa; --surface-3:#e8ecf2; --border:#e2e6ed; --text:#151a23; --text-2:#465061; --text-3:#7d8798; --shadow:0 1px 2px rgb(16 24 40/.05),0 10px 30px rgb(16 24 40/.08); }
[data-preset=slate][data-mode=dark]  { --bg:#0d1015; --surface:#151920; --surface-2:#1b2029; --surface-3:#252b36; --border:#242a34; --text:#e7eaf0; --text-2:#aab2bf; --text-3:#747e8d; --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.35); }
[data-preset=paper]  { --bg:#f3efe7; --surface:#fffdf8; --surface-2:#f8f4ec; --surface-3:#ede6d9; --border:#e5ddcd; --text:#2a251d; --text-2:#5b5345; --text-3:#8f8574; --shadow:0 1px 2px rgb(60 40 10/.06),0 10px 30px rgb(60 40 10/.08); }
[data-preset=paper][data-mode=dark]  { --bg:#15120e; --surface:#1d1a15; --surface-2:#24201a; --surface-3:#2f2a22; --border:#2e2820; --text:#f0e9db; --text-2:#bbb09d; --text-3:#877d6b; --shadow:0 1px 2px rgb(0 0 0/.3),0 10px 30px rgb(0 0 0/.35); }
[data-preset=fjord]  { --bg:#e9eff2; --surface:#fbfdfe; --surface-2:#f1f6f8; --surface-3:#dfe8ec; --border:#d8e2e7; --text:#17262f; --text-2:#465a66; --text-3:#7c8f99; --shadow:0 1px 2px rgb(10 40 60/.06),0 10px 30px rgb(10 40 60/.08); }
[data-preset=fjord][data-mode=dark]  { --bg:#0a101c; --surface:#101828; --surface-2:#152036; --surface-3:#1d2a44; --border:#1c273b; --text:#e2e8f3; --text-2:#a1aec3; --text-3:#6c7a92; --shadow:0 1px 2px rgb(0 0 0/.35),0 10px 30px rgb(0 0 0/.4); }
[data-preset=contrast] { --bg:#fff; --surface:#fff; --surface-2:#f0f0f0; --surface-3:#e0e0e0; --border:#111; --text:#000; --text-2:#111; --text-3:#333; --shadow:none; --accent-ink: color-mix(in oklab, var(--accent) 70%, black); }
[data-preset=contrast][data-mode=dark] { --bg:#000; --surface:#000; --surface-2:#161616; --surface-3:#2a2a2a; --border:#f2f2f2; --text:#fff; --text-2:#f0f0f0; --text-3:#cfcfcf; --shadow:none; --accent-ink: color-mix(in oklab, var(--accent) 45%, white); }

/* Density */
[data-density=compact]     { --row-py:7px;  --fs-list:13px;   --avatar:28px; --fs-base:13.5px; --side-item:30px; --pad-pane:10px; }
[data-density=comfortable] { --row-py:11px; --fs-list:13.5px; --avatar:36px; --fs-base:14px;   --side-item:34px; --pad-pane:12px; }
[data-density=spacious]    { --row-py:16px; --fs-list:14.5px; --avatar:42px; --fs-base:15px;   --side-item:40px; --pad-pane:14px; }

/* ───────────── Base ───────────── */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font: var(--fs-base)/1.45 var(--font);
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; overflow: hidden;
  font-feature-settings: "cv11", "ss01";
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
.ic { flex: none; display: block; }
.ic.filled { fill: currentColor; }
[dir=rtl] .ic.flip { transform: scaleX(-1); }
.spacer { flex: 1; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 0; background: none;
  display: grid; place-items: center; color: var(--text-2); cursor: pointer; flex: none;
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn.sm { width: 32px; height: 32px; }
.icon-btn.on { color: var(--star); }
.btn {
  height: 36px; padding-inline: 14px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); display: inline-flex; align-items: center; gap: 8px;
  font-weight: 550; cursor: pointer; white-space: nowrap; transition: background .15s, transform .1s;
}
.btn:hover { background: var(--surface-2); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
.btn.primary:hover { background: color-mix(in oklab, var(--accent) 88%, black); }
.kbd {
  font: 600 11px/1 var(--font); padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border);
  color: var(--text-3); background: var(--surface); white-space: nowrap;
}

/* ───────────── App frame ───────────── */
.app { display: grid; grid-template-rows: 64px minmax(0, 1fr); height: 100vh; height: 100dvh; }
.topbar { display: flex; align-items: center; gap: 8px; padding-inline: 12px 16px; min-width: 0; }
.brand {
  display: flex; align-items: center; gap: 10px; width: calc(var(--sidebar-w) - 58px);
  font-weight: 680; font-size: 19px; letter-spacing: -.015em; flex: none; overflow: hidden;
  transition: width .2s var(--ease);
}
.brand .badge {
  font-size: 10.5px; font-weight: 650; letter-spacing: .04em; text-transform: uppercase;
  padding: 3px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink);
}
.logo { flex: none; }
.search {
  flex: 1; max-width: 720px; min-width: 0; display: flex; align-items: center; gap: 10px;
  height: 46px; padding-inline: 16px 10px; border-radius: 999px; background: var(--surface-3);
  border: 1px solid transparent; color: var(--text-3); transition: background .15s, box-shadow .15s, border-color .15s;
}
.search:focus-within { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow); }
.search input {
  flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; font-size: 15px; color: var(--text);
}
.search input::-webkit-search-cancel-button { display: none; }
.top-actions { margin-inline-start: auto; display: flex; align-items: center; gap: 2px; }
.cmdk { height: 34px; padding-inline: 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); cursor: pointer; font-size: 12.5px; font-weight: 600; margin-inline-end: 6px; }
.cmdk:hover { background: var(--surface-2); }
.me-btn { border: 0; background: none; padding: 0; margin-inline-start: 6px; cursor: pointer; border-radius: 50%; }

.shell { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 0; transition: grid-template-columns .2s var(--ease); }

/* ───────────── Sidebar ───────────── */
.sidebar { display: flex; flex-direction: column; padding: 2px 10px 12px; overflow-y: auto; overflow-x: hidden; min-height: 0; }
.compose-btn {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding-inline: 14px 18px; border-radius: 12px;
  border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 600; font-size: 14px; cursor: pointer;
  align-self: flex-start; margin: 4px 0 12px 4px; white-space: nowrap;
  box-shadow: 0 1px 2px rgb(0 0 0/.08), 0 3px 10px color-mix(in oklab, var(--accent) 25%, transparent);
  transition: transform .15s var(--ease), box-shadow .15s;
}
.compose-btn:hover { background: color-mix(in oklab, var(--accent) 90%, black); }
.nav-item {
  display: flex; align-items: center; gap: 14px; min-height: var(--side-item); padding-inline: 14px 12px; border-radius: 999px;
  color: var(--text-2); cursor: pointer; border: 0; background: none; width: 100%; text-align: start; flex: none;
  transition: background .12s;
}
.nav-item:hover { background: var(--surface-3); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 620; }
.nav-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .count { font-size: 12px; font-weight: 650; }
.nav-item .sub { font-size: 11.5px; color: var(--text-3); font-weight: 400; display: block; overflow: hidden; text-overflow: ellipsis; }
.nav-section { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); padding: 18px 14px 6px; font-weight: 650; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ldot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.storage { margin-top: auto; padding: 18px 14px 4px; font-size: 12px; color: var(--text-3); }
.meter { height: 4px; border-radius: 4px; background: var(--surface-3); margin-bottom: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 14%; background: var(--accent); border-radius: 4px; }

@media (min-width: 721px) {
  .app.rail { --sidebar-w: 80px; }
  .app.rail .brand .wordmark, .app.rail .brand .badge { display: none; }
  .app.rail .brand { width: 22px; }
  .app.rail .nav-item .label, .app.rail .nav-item .count, .app.rail .nav-section, .app.rail .compose-btn span, .app.rail .storage { display: none; }
  .app.rail .nav-item { justify-content: center; padding: 0; width: 48px; min-height: 40px; margin-inline: auto; position: relative; }
  .app.rail .nav-item.has-unread::after { content: ""; position: absolute; top: 8px; inset-inline-end: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .app.rail .compose-btn { padding: 0; width: 44px; justify-content: center; align-self: center; margin-inline: 0; }
  .app.rail .nav-sep { height: 1px; background: var(--border); margin: 10px 14px; flex: none; }
}
.nav-sep { display: none; }

/* ───────────── Main / panes ───────────── */
.main { display: grid; min-height: 0; min-width: 0; padding-block-end: 10px; padding-inline-end: 10px; }
.main[data-layout=right] { grid-template-columns: minmax(300px, var(--list-w)) 10px minmax(0, 1fr); }
.main[data-layout=below] { grid-template-rows: minmax(150px, var(--list-h)) 10px minmax(0, 1fr); }
.main[data-layout=off] { grid-template-columns: minmax(0, 1fr); }
.main[data-layout=off] .divider { display: none; }
.main[data-layout=off].reading .list-pane { display: none; }
.main[data-layout=off]:not(.reading) .reader-pane { display: none; }
.pane {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
}
.divider { position: relative; cursor: col-resize; touch-action: none; }
.main[data-layout=below] .divider { cursor: row-resize; }
.divider::after {
  content: ""; position: absolute; border-radius: 3px; background: var(--accent); opacity: 0; transition: opacity .15s;
  inset-block: 35%; inset-inline-start: 4px; width: 2px;
}
.main[data-layout=below] .divider::after { inset-block: 4px auto; inset-inline: 40%; width: auto; height: 2px; }
.divider:hover::after, body.resizing .divider::after { opacity: .7; }
body.resizing { user-select: none; cursor: col-resize; }
body.resizing.rows { cursor: row-resize; }

/* ───────────── List ───────────── */
.list-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px; padding-inline-start: 10px; min-height: 58px; border-bottom: 1px solid var(--border); }
.lh-title { min-width: 0; padding-inline-start: 4px; }
.list-title { font-weight: 680; font-size: 16.5px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-sub { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.bulk-count { font-weight: 650; padding-inline: 6px; white-space: nowrap; }
.chips { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; flex: none; }
.chip {
  height: 28px; padding-inline: 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); font-size: 12.5px; font-weight: 550; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.chip:hover { background: var(--surface-2); }
.chip.on { background: var(--accent-soft); border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); color: var(--accent-ink); }
.list { overflow-y: auto; flex: 1; container-type: inline-size; container-name: list; }

.row {
  position: relative; display: grid; grid-template-columns: var(--avatar) minmax(0, 1fr); column-gap: 12px; align-items: center;
  padding: var(--row-py) 14px; padding-inline-start: 12px; cursor: pointer; font-size: var(--fs-list);
  border-bottom: 1px solid color-mix(in oklab, var(--border) 55%, transparent); transition: background .1s;
}
.row:hover { background: var(--surface-2); }
.row.checked { background: var(--accent-softer); }
.row.open { background: var(--accent-soft); }
.row.open::before, .row.cursor::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--accent); }
.row.cursor:not(.open)::before { background: var(--text-3); }
.row.arrive { animation: arrive .9s var(--ease); }
@keyframes arrive { from { background: var(--accent-soft); transform: translateY(-6px); opacity: 0; } 40% { opacity: 1; transform: none; } }

.av {
  width: var(--avatar); height: var(--avatar); border-radius: 50%; display: grid; place-items: center; position: relative; flex: none;
  font-weight: 650; font-size: calc(var(--avatar) * .37); letter-spacing: .01em;
  background: hsl(var(--h) 62% 90%); color: hsl(var(--h) 45% 30%);
}
[data-mode=dark] .av { background: hsl(var(--h) 30% 26%); color: hsl(var(--h) 70% 84%); }
[data-preset=contrast] .av { box-shadow: inset 0 0 0 1.5px var(--text); }
.av.lg { --avatar: 40px; }
.av .chk {
  position: absolute; inset: 0; border-radius: 50%; display: none; place-items: center; background: var(--surface);
  border: 2px solid var(--text-3); color: transparent;
}
.row:hover .av .chk, .list.selecting .av .chk, .row.checked .av .chk { display: grid; }
.row.checked .av .chk { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

.r-main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; row-gap: 1px; }
.r-from { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--text); }
.r-from .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-count { color: var(--text-3); font-size: 11.5px; font-weight: 500; }
.r-meta { grid-column: 2; grid-row: 1; display: flex; align-items: center; gap: 6px; color: var(--text-3); font-size: 12px; white-space: nowrap; }
.r-text { grid-column: 1 / -1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-3); }
.r-subj { color: var(--text-2); }
.r-labels { grid-column: 1 / -1; display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
.row.unread .r-from, .row.unread .r-subj { font-weight: 680; color: var(--text); }
.row.unread .r-meta time { color: var(--accent-ink); font-weight: 650; }
.udot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.acc-dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.r-star { border: 0; background: none; padding: 2px; cursor: pointer; color: var(--text-3); display: grid; border-radius: 6px; }
.r-star:hover { color: var(--text); }
.r-star.on { color: var(--star); }
.draft-tag { color: var(--danger); font-weight: 650; }
.lchip { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding-inline: 7px; border-radius: 6px; font-size: 11px; font-weight: 600; background: color-mix(in oklab, var(--c) 14%, var(--surface)); color: color-mix(in oklab, var(--c) 70%, var(--text)); }
[data-mode=dark] .lchip { background: color-mix(in oklab, var(--c) 22%, var(--surface)); color: color-mix(in oklab, var(--c) 55%, white); }

.r-actions {
  position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); display: none; gap: 2px; padding: 3px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow);
}
.r-actions button { width: 32px; height: 32px; border: 0; border-radius: 8px; background: none; color: var(--text-2); display: grid; place-items: center; cursor: pointer; }
.r-actions button:hover { background: var(--surface-3); color: var(--text); }
.row:hover .r-actions { display: flex; }
@media (hover: none) { .row:hover .r-actions { display: none; } }

[data-density=spacious] .r-text { white-space: normal; }
[data-density=spacious] .r-subj { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-block: 2px 1px; }
[data-density=spacious] .r-sep { display: none; }
[data-density=spacious] .r-snip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45; }
[data-density=compact] .r-labels { display: none; }

@container list (min-width: 660px) {
  [data-density=compact] .r-main, [data-density=comfortable] .r-main { grid-template-columns: minmax(130px, 200px) minmax(0, 1fr) auto; align-items: center; }
  [data-density=compact] .r-text, [data-density=comfortable] .r-text { grid-column: 2; grid-row: 1; }
  [data-density=compact] .r-meta, [data-density=comfortable] .r-meta { grid-column: 3; }
  [data-density=comfortable] .r-labels { grid-column: 2; grid-row: 2; margin-top: 3px; }
}

.empty { display: grid; place-items: center; text-align: center; padding: 60px 24px; color: var(--text-3); gap: 6px; height: 100%; align-content: center; }
.empty .big { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-3); margin-bottom: 10px; }
.empty b { color: var(--text-2); font-size: 15px; }

/* ───────────── Reader ───────────── */
.reader-head { display: flex; align-items: center; gap: 2px; padding: 8px; min-height: 58px; border-bottom: 1px solid var(--border); }
.tb { width: 36px; height: 36px; border-radius: 10px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--text-2); flex: none; }
.tb:hover { background: var(--surface-3); color: var(--text); }
.tb.on { color: var(--star); }
.tb-sep { width: 1px; height: 22px; background: var(--border); margin-inline: 6px; flex: none; }
.pos { color: var(--text-3); font-size: 12.5px; padding-inline: 8px; white-space: nowrap; }
.reader-scroll { overflow-y: auto; flex: 1; container-type: inline-size; container-name: reader; }
@container reader (max-width: 600px) {
  .reader-inner { padding: 16px 12px 40px; }
  .msg-body, .atts { padding-inline: 16px; }
  .img-banner { margin-inline: 16px; }
  .mh-email { display: none; }
  .msg-head { grid-template-columns: 40px minmax(0, 1fr); }
  .mh-side { grid-column: 1 / -1; justify-content: flex-end; margin-top: -6px; }
  .subject-line h1 { font-size: 19px; }
}
.reader-inner { max-width: 880px; margin-inline: auto; padding: 22px 28px 48px; }
.subject-line { display: flex; align-items: flex-start; gap: 12px; margin: 0 4px 18px; }
.subject-line h1 { font-size: 22px; font-weight: 680; letter-spacing: -.015em; margin: 0; line-height: 1.3; flex: 1; text-wrap: balance; }
.subject-line .lchips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.msg { border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; background: var(--surface); overflow: hidden; }
.msg.collapsed { cursor: pointer; }
.msg.collapsed:hover { background: var(--surface-2); }
.msg-head { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; padding: 14px 16px; align-items: center; }
.msg:not(.collapsed) .msg-head { cursor: pointer; }
.mh-who { min-width: 0; }
.mh-who b { font-weight: 650; }
.mh-email { color: var(--text-3); font-size: 12.5px; }
.mh-to, .mh-snip { color: var(--text-3); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mh-side { display: flex; align-items: center; gap: 2px; color: var(--text-3); font-size: 12.5px; white-space: nowrap; }
.mh-side time { margin-inline-end: 6px; }
.msg-body { padding: 0 20px 20px; padding-inline-start: 68px; font-size: 15px; line-height: 1.62; color: var(--text); overflow-wrap: anywhere; }
.msg-body p { margin: 0 0 .85em; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body blockquote { margin: 0; padding-inline-start: 12px; border-inline-start: 3px solid var(--border); color: var(--text-2); }
.earlier { display: flex; align-items: center; gap: 12px; margin: -2px 0 10px; color: var(--text-3); font-size: 12.5px; }
.earlier::before, .earlier::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.earlier button { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; height: 30px; padding-inline: 14px; cursor: pointer; color: var(--text-2); font-weight: 600; font-size: 12.5px; }
.earlier button:hover { background: var(--surface-2); }
.img-banner { margin: 0 20px 16px; margin-inline-start: 68px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--border); font-size: 13px; color: var(--text-2); }
.img-banner .btn { height: 30px; font-size: 12.5px; }
.rimg { height: 150px; border-radius: 12px; margin-bottom: 16px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 20px; letter-spacing: -.01em;
  background: linear-gradient(135deg, hsl(var(--h) 75% 55%), hsl(calc(var(--h) + 50) 80% 60%)); }
.rimg.blocked { background: repeating-linear-gradient(45deg, var(--surface-2) 0 10px, var(--surface-3) 10px 20px); color: var(--text-3); font-size: 13px; font-weight: 600; height: 64px; }
.atts { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 20px; padding-inline-start: 68px; }
.att { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border); border-radius: 12px; padding: 8px 14px 8px 8px; min-width: 210px; max-width: 280px; cursor: pointer; background: var(--surface); }
.att:hover { background: var(--surface-2); }
.att-ic { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-size: 9.5px; font-weight: 800; color: #fff; background: #e5484d; flex: none; letter-spacing: .03em; }
.att-ic.img { background: #8e4ec6; } .att-ic.doc { background: #3b6cf6; }
.att-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.att-size { color: var(--text-3); font-size: 12px; }
.reply-bar { display: flex; gap: 8px; margin: 18px 4px 0; flex-wrap: wrap; }

.reader-empty { height: 100%; display: grid; place-items: center; align-content: center; text-align: center; gap: 8px; color: var(--text-3); padding: 24px; }
.reader-empty .mark { width: 88px; height: 88px; border-radius: 28px; display: grid; place-items: center; background: var(--accent-softer); margin-bottom: 8px; }
.reader-empty b { color: var(--text-2); font-size: 15.5px; font-weight: 620; }

/* ───────────── Compose ───────────── */
.composes { position: fixed; inset-block-end: 0; inset-inline-end: 24px; display: flex; flex-direction: row-reverse; gap: 14px; align-items: flex-end; z-index: 40; pointer-events: none; }
.compose {
  pointer-events: auto; width: 540px; height: 580px; max-height: calc(100dvh - 80px); background: var(--surface);
  border: 1px solid var(--border); border-bottom: 0; border-radius: 16px 16px 0 0; box-shadow: 0 16px 60px rgb(0 0 0/.24);
  display: flex; flex-direction: column; overflow: hidden; animation: rise .22s var(--ease);
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
@keyframes pop { from { transform: scale(.97) translateY(6px); opacity: 0; } }
.compose.min { height: auto; width: 300px; }
.compose.min > :not(.c-head) { display: none; }
.compose.max { position: fixed; inset: 6vh 9vw; width: auto; height: auto; max-height: none; border-radius: 18px; border-bottom: 1px solid var(--border); box-shadow: 0 0 0 100vmax rgb(8 12 18/.4), 0 24px 80px rgb(0 0 0/.35); z-index: 60; animation: pop .2s var(--ease); }
.c-head { display: flex; align-items: center; gap: 2px; padding: 8px; padding-inline-start: 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-weight: 650; font-size: 13.5px; cursor: default; }
.compose.min .c-head { cursor: pointer; border-bottom: 0; }
.c-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-field { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); padding-inline: 16px; height: 44px; flex: none; }
.c-field label { color: var(--text-3); font-size: 13.5px; min-width: 44px; }
.c-field input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: inherit; font-size: 14.5px; color: var(--text); }
.c-field .from { color: var(--text-2); font-size: 13.5px; }
.c-body { flex: 1; padding: 14px 16px; overflow: auto; outline: none; font-size: 15px; line-height: 1.6; }
.c-body:empty::before { content: attr(data-placeholder); color: var(--text-3); pointer-events: none; }
.c-body blockquote { margin: 12px 0 0; padding-inline-start: 12px; border-inline-start: 3px solid var(--border); color: var(--text-2); }
.c-foot { display: flex; align-items: center; gap: 2px; padding: 10px 12px; border-top: 1px solid var(--border); }
.c-foot .btn.primary { padding-inline: 20px; margin-inline-end: 8px; }
.c-saved { color: var(--text-3); font-size: 12px; margin-inline-start: 8px; white-space: nowrap; }
.compose.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

/* ───────────── Overlays ───────────── */
.scrim { position: fixed; inset: 0; background: rgb(8 12 18/.38); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; }
.scrim.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; inset-block: 0; inset-inline-end: 0; width: min(430px, 100vw); background: var(--surface); z-index: 55;
  border-inline-start: 1px solid var(--border); box-shadow: 0 0 60px rgb(0 0 0/.18); display: flex; flex-direction: column;
  transform: translateX(105%); transition: transform .28s var(--ease); visibility: hidden;
}
[dir=rtl] .drawer { transform: translateX(-105%); }
.drawer.open { transform: none; visibility: visible; }
.s-head { display: flex; align-items: center; gap: 8px; padding: 14px 12px 14px 22px; padding-inline: 22px 12px; border-bottom: 1px solid var(--border); }
.s-head h2 { margin: 0; font-size: 18px; font-weight: 680; flex: 1; }
.s-body { overflow-y: auto; padding: 4px 22px 28px; flex: 1; }
.s-body h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); margin: 24px 0 12px; font-weight: 680; }
.s-row { margin-bottom: 18px; }
.s-label { font-weight: 600; margin-bottom: 8px; font-size: 13.5px; }
.s-hint { color: var(--text-3); font-size: 12.5px; margin-top: 2px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-3); padding: 3px; border-radius: 11px; gap: 3px; }
.seg button { height: 34px; border: 0; border-radius: 8px; background: none; color: var(--text-2); font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0/.12), 0 1px 6px rgb(0 0 0/.05); }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cards.three { grid-template-columns: repeat(3, 1fr); }
.card {
  border: 1.5px solid var(--border); border-radius: 13px; padding: 7px; background: var(--surface); cursor: pointer; text-align: start; color: var(--text-2);
  font-size: 12.5px; font-weight: 600; transition: border-color .15s, box-shadow .15s;
}
.card:hover { border-color: color-mix(in oklab, var(--accent) 40%, var(--border)); }
.card.on { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 22%, transparent); color: var(--text); }
.card .cap { padding: 7px 3px 2px; display: flex; align-items: center; gap: 6px; }
.tp { height: 66px; border-radius: 8px; display: grid; grid-template-columns: 24% 1fr; gap: 4px; padding: 5px; }
.tp i { border-radius: 4px; display: block; }
.tp .pnl { display: flex; flex-direction: column; gap: 5px; padding: 7px; }
.tp .pnl b { display: block; height: 5px; border-radius: 3px; }
.lp { height: 54px; display: grid; gap: 3px; border-radius: 8px; background: var(--surface-2); padding: 4px; }
.lp i { background: var(--surface-3); border-radius: 3px; display: block; }
.lp i.r { background: color-mix(in oklab, var(--accent) 30%, var(--surface-3)); }
.lp.right { grid-template-columns: 18% 34% 1fr; }
.lp.below { grid-template-columns: 18% 1fr; grid-template-rows: 45% 1fr; }
.lp.below i:first-child { grid-row: 1 / 3; }
.lp.off { grid-template-columns: 18% 1fr; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 0; cursor: pointer; background: var(--c); box-shadow: inset 0 0 0 1px rgb(0 0 0/.12); position: relative; display: grid; place-items: center; color: #fff; }
.sw.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }
.sw.custom { background: conic-gradient(from 0deg, #f43f5e, #f59e0b, #84cc16, #10b981, #06b6d4, #6366f1, #d946ef, #f43f5e); overflow: hidden; }
.sw.custom input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: 0; padding: 0; }
.switch-row { display: flex; align-items: center; gap: 14px; cursor: pointer; }
.switch-row > div { flex: 1; }
.switch { width: 42px; height: 25px; border-radius: 999px; background: var(--surface-3); position: relative; border: 0; cursor: pointer; flex: none; transition: background .18s; box-shadow: inset 0 0 0 1px var(--border); }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 19px; height: 19px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0/.3); transition: inset-inline-start .18s var(--ease); }
.switch.on { background: var(--accent); box-shadow: none; }
.switch.on::after { inset-inline-start: 20px; }
.s-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 12px; }

.modal-wrap { position: fixed; inset: 0; z-index: 70; display: flex; justify-content: center; align-items: flex-start; padding: 13vh 16px 16px; background: rgb(8 12 18/.4); }
.modal-wrap[hidden] { display: none; }
.palette, .help { width: min(600px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 30px 80px rgb(0 0 0/.35); overflow: hidden; animation: pop .16s var(--ease); }
.p-input { display: flex; align-items: center; gap: 12px; padding-inline: 20px; border-bottom: 1px solid var(--border); color: var(--text-3); }
.p-input input { flex: 1; height: 58px; border: 0; background: none; outline: none; font: inherit; font-size: 16.5px; color: var(--text); }
.p-list { max-height: min(430px, 56vh); overflow-y: auto; padding: 6px; }
.p-group { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); padding: 10px 14px 4px; font-weight: 680; }
.p-item { display: flex; align-items: center; gap: 12px; padding: 0 14px; height: 42px; border-radius: 10px; cursor: pointer; color: var(--text-2); }
.p-item.on { background: var(--accent-soft); color: var(--text); }
.p-item .kbd { margin-inline-start: auto; }
.p-empty { padding: 28px; text-align: center; color: var(--text-3); }
.help { width: min(720px, 100%); }
.help-head { display: flex; align-items: center; padding: 14px 12px; padding-inline-start: 22px; border-bottom: 1px solid var(--border); }
.help-head h2 { margin: 0; font-size: 17px; flex: 1; }
.help-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 36px; padding: 18px 22px 24px; }
.help-grid h3 { grid-column: span 1; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); margin: 6px 0 4px; }
.hk { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 32px; color: var(--text-2); font-size: 13.5px; border-bottom: 1px solid color-mix(in oklab, var(--border) 50%, transparent); }
.hk span:last-child { display: flex; gap: 4px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; z-index: 80;
  display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 6px 6px; padding-inline-start: 18px; border-radius: 14px;
  background: var(--text); color: var(--surface); box-shadow: 0 12px 40px rgb(0 0 0/.3); font-weight: 550; font-size: 14px;
  transition: transform .25s var(--ease), opacity .2s; max-width: calc(100vw - 32px);
}
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { border: 0; background: none; color: color-mix(in oklab, var(--accent) 50%, var(--surface)); font-weight: 700; height: 36px; padding-inline: 12px; border-radius: 9px; cursor: pointer; }
.toast button:hover { background: color-mix(in oklab, var(--surface) 15%, transparent); }
.toast button.x { color: var(--surface); opacity: .7; padding-inline: 8px; display: grid; place-items: center; }
.toast .tmsg { padding-inline-end: 8px; }

.tip {
  position: fixed; inset-block-end: 22px; inset-inline-start: 22px; width: 340px; z-index: 45; background: var(--surface);
  border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow), 0 20px 60px rgb(0 0 0/.15); padding: 16px 16px 14px; animation: rise .4s var(--ease) .4s both;
}
.tip b { display: block; margin-bottom: 4px; font-size: 14.5px; }
.tip p { margin: 0 0 12px; color: var(--text-2); font-size: 13.5px; line-height: 1.5; }
.tip .row-btns { display: flex; gap: 8px; justify-content: flex-end; }
.tip .btn { height: 32px; font-size: 13px; }

.fab { display: none; position: fixed; inset-inline-end: 18px; inset-block-end: calc(18px + env(safe-area-inset-bottom)); z-index: 30; height: 48px; padding-inline: 16px 20px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accent-fg); font-weight: 650; align-items: center; gap: 10px; box-shadow: 0 8px 24px color-mix(in oklab, var(--accent) 45%, transparent); cursor: pointer; }
.spin .ic { animation: spin .7s var(--ease); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ───────────── Mobile ───────────── */
@media (max-width: 720px) {
  .topbar { gap: 4px; padding-inline: 6px 10px; }
  .app { grid-template-rows: 60px minmax(0, 1fr); }
  .brand { width: auto; }
  .brand .wordmark, .brand .badge { display: none; }
  .search { height: 42px; padding-inline: 12px 8px; }
  .search .kbd, .hide-m { display: none; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar {
    position: fixed; inset-block: 0; inset-inline-start: 0; width: 296px; background: var(--surface); z-index: 56; padding-top: 16px;
    transform: translateX(-105%); transition: transform .26s var(--ease); box-shadow: 0 0 60px rgb(0 0 0/.25); visibility: hidden;
  }
  [dir=rtl] .sidebar { transform: translateX(105%); }
  .app.drawer-open .sidebar { transform: none; visibility: visible; }
  .main { padding: 0; }
  .pane { border-radius: 0; border-inline: 0; border-bottom: 0; }
  .fab { display: inline-flex; }
  .msg-body, .atts { padding-inline: 16px; }
  .img-banner { margin-inline: 16px; }
  .msg-head { padding: 12px 14px; }
  .reader-inner { padding: 16px 12px 100px; }
  .subject-line h1 { font-size: 19px; }
  .compose, .compose.max { position: fixed; inset: 0; width: auto; height: auto; max-height: none; border-radius: 0; box-shadow: none; z-index: 60; }
  .compose.min { inset: auto 0 0 0; }
  .composes { inset-inline: 0; }
  .tip { inset-inline: 12px; width: auto; inset-block-end: 90px; }
  .r-actions { display: none !important; }
  .help-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" data-action="menu" data-i18n-title="a.menu"><i data-ic="menu"></i></button>
    <div class="brand">
      <svg class="logo" width="32" height="32" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="17" fill="var(--accent)"/><g transform="translate(9 4.6) scale(.72)"><path d="M6 31c8.5-7.5 17.5-7 26 3.5C40.5 24 49.5 23.5 58 31c-8.6-2.4-17 .8-26 10.8C23 31.8 14.6 28.6 6 31z" fill="var(--accent-fg)"/><path d="M14 50c3-2.6 6-2.6 9 0s6 2.6 9 0 6-2.6 9 0 6 2.6 9 0" fill="none" stroke="var(--accent-fg)" stroke-width="4" stroke-linecap="round" opacity=".6"/></g></svg>
      <span class="wordmark">Petrel</span><span class="badge" data-i18n="mockBadge"></span>
    </div>
    <label class="search">
      <i data-ic="search"></i>
      <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search">
      <button class="icon-btn sm" id="clearSearch" data-action="clear-search" hidden data-i18n-title="a.clear"><i data-ic="x"></i></button>
      <kbd class="kbd">/</kbd>
    </label>
    <div class="top-actions">
      <button class="cmdk hide-m" data-action="palette" data-i18n-title="a.palette"><i data-ic="command"></i><span id="cmdkLabel">⌘K</span></button>
      <button class="icon-btn hide-m" data-action="help" data-i18n-title="a.help"><i data-ic="keyboard"></i></button>
      <button class="icon-btn" data-action="theme-toggle" data-i18n-title="a.theme" id="themeBtn"></button>
      <button class="icon-btn" data-action="settings-open" data-i18n-title="a.settings"><i data-ic="sliders"></i></button>
      <button class="me-btn" title="Sam Taylor" data-action="settings-open"><span class="av" style="--h:262;--avatar:34px">ST</span></button>
    </div>
  </header>
  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Mailboxes"></nav>
    <main class="main" id="main">
      <section class="pane list-pane" id="listPane" aria-label="Messages"></section>
      <div class="divider" id="divider" role="separator" aria-orientation="vertical"></div>
      <section class="pane reader-pane" id="readerPane" aria-label="Reading pane"></section>
    </main>
  </div>
</div>
<button class="fab" data-action="compose"><i data-ic="pencil"></i><span data-i18n="compose"></span></button>
<div class="scrim" id="scrim" data-action="scrim"></div>
<aside class="drawer" id="settings" aria-label="Settings"></aside>
<div class="modal-wrap" id="paletteWrap" hidden></div>
<div class="modal-wrap" id="helpWrap" hidden></div>
<div class="composes" id="composes"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="tipHost"></div>

<script>
/* ═════════════ Icons ═════════════ */
const ICONS = {
  menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/>',
  inbox: '<path d="M3 13l2.5-8h13L21 13v6H3z"/><path d="M3 13h5l1.5 2.5h5L16 13h5"/>',
  star: '<path d="M12 3.5l2.6 5.3 5.9.9-4.25 4.1 1 5.8L12 16.8l-5.25 2.8 1-5.8L3.5 9.7l5.9-.9z"/>',
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  file: '<path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5"/>',
  send: '<path d="M21 3L10 14"/><path d="M21 3l-6.5 18-4.5-7-7-4.5z"/>',
  archive: '<rect x="3" y="4" width="18" height="4.5" rx="1.2"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5M10 12.5h4"/>',
  spam: '<path d="M8.2 3h7.6L21 8.2v7.6L15.8 21H8.2L3 15.8V8.2z"/><path d="M12 8v5M12 16.2v.1"/>',
  trash: '<path d="M4 7h16M9.5 7V4.5h5V7M6 7l1 13h10l1-13M10 11v5.5M14 11v5.5"/>',
  tag: '<path d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8L21 12l-8.5 8.5z"/><circle cx="8" cy="8" r="1.4"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',

  if (d.getFullYear() === now.getFullYear()) return d.toLocaleDateString(L, { month: 'short', day: 'numeric' });

}

/* ═════════════ Actions ═════════════ */
function openItem(id, { scroll = true } = {}) {
  const it = itemById(id);
  if (!it) return;
  state.openId = id; state.cursorId = id;
  it.msgs.forEach((m) => { m.unread = false; });
  render();
  $('#readerPane .reader-scroll')?.scrollTo(0, 0);
  if (scroll) document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'nearest' });
}
function closeReader() { state.openId = null; render(); }
function neighbourAfterRemoval(ids) {
  const items = state.items;
  const openTh = state.openId ? threadOf(state.openId)?.id : null;
  if (!openTh || !ids.includes(openTh)) return undefined;
  const idx = items.findIndex((i) => i.id === state.openId);
  for (let j = idx + 1; j < items.length; j++) if (!ids.includes(items[j].th.id)) return items[j].id;
  for (let j = idx - 1; j >= 0; j--) if (!ids.includes(items[j].th.id)) return items[j].id;
  return null;
}
function moveThreads(ids, folder, toastKey) {
  ids = [...new Set(ids)];
  if (!ids.length) return;
  const next = neighbourAfterRemoval(ids);
  const prevOpen = state.openId;
  const before = ids.map((id) => { const th = threadOf(id); return [th, th.folder]; });
  let removed = [];
  if (folder === null) { // delete forever
    removed = threads.filter((th) => ids.includes(th.id));
    threads = threads.filter((th) => !ids.includes(th.id));
  } else before.forEach(([th]) => { th.folder = folder; });
  state.checked.clear();
  if (next !== undefined) {
    if (next && effLayout() !== 'off') openItem(next, { scroll: true }); else { state.openId = null; render(); }
  } else render();
  toast(t(toastKey, { n: ids.length }), () => {
    if (folder === null) threads.push(...removed);
    before.forEach(([th, f]) => { th.folder = f; });
    state.openId = prevOpen; render();
  });
}
function threadsForAction(el) {
  if (el?.dataset.th) return [el.dataset.th];
  const th = state.openId && threadOf(state.openId);
  return th ? [th.id] : [];
}
function deleteThreads(ids) {
  const inTrash = ids.every((id) => threadOf(id)?.folder === 'trash');
  moveThreads(ids, inTrash ? null : 'trash', inTrash ? 't.deletedForever' : 't.deleted');
}
function setRead(itemIds, read) {
  itemIds.forEach((id) => itemById(id)?.msgs.forEach((m) => { m.unread = !read; }));
  if (!read && itemIds.includes(state.openId) && effLayout() === 'off') state.openId = null;
  render();
}
function move(dir) {
  const items = state.items;
  if (!items.length) return;
  const reading = !!state.openId && effLayout() === 'off';
  const cur = effLayout() === 'off' && !reading ? state.cursorId : state.openId;
  let idx = items.findIndex((i) => i.id === cur);
  idx = idx < 0 ? 0 : Math.max(0, Math.min(items.length - 1, idx + dir));
  const id = items[idx].id;
  if (effLayout() === 'off' && !reading) {
    state.cursorId = id; renderList();
    document.querySelector(`.row[data-id="${CSS.escape(id)}"]`)?.scrollIntoView({ block: 'nearest' });
  } else openItem(id);
}
function setPref(k, v) {
  if (k === 'threads' && state.openId) state.openId = state.openId.split(':')[0];
  prefs[k] = v; savePrefs(); render();
}

  FOLDERS.forEach((f) => c.push({ g: t('p.goto'), icon: f.icon, label: t('p.goTo', { x: t(f.id) }), run: () => goFolder(f.id) }));
  [['light', 'sun'], ['dark', 'moon'], ['system', 'monitor']].forEach(([m, i]) => c.push({ g: t('p.appearance'), icon: i, label: t('p.mode', { x: t(m) }), run: () => setPref('mode', m) }));
  Object.entries(PRESETS).forEach(([id, p]) => c.push({ g: t('p.appearance'), icon: 'palette', label: t('p.theme', { x: p.name }), run: () => setPref('preset', id) }));
  ACCENTS.forEach(([n, col]) => c.push({ g: t('p.appearance'), icon: 'palette', label: t('p.accent', { x: n }), run: () => setPref('accent', col) }));
  ['right', 'below', 'off'].forEach((v) => c.push({ g: t('p.layout'), icon: 'layout', label: t('p.pane', { x: t('pane.' + v) }), run: () => setPref('layout', v) }));
  ['compact', 'comfortable', 'spacious'].forEach((v) => c.push({ g: t('p.layout'), icon: 'rows', label: t('p.density', { x: t(v) }), run: () => setPref('density', v) }));
  c.push({ g: t('p.layout'), icon: 'thread', label: t('p.threads'), run: () => setPref('threads', !prefs.threads) });
  Object.entries(LANGS).forEach(([v, n]) => c.push({ g: t('p.language'), icon: 'globe', label: t('p.lang', { x: n }), run: () => setPref('lang', v) }));
  c.push({ g: t('p.language'), icon: 'rtl', label: t('p.rtl'), run: () => setPref('rtl', !prefs.rtl) });
  return c;
}
function openPalette() {
  state.palette = true; palIndex = 0;
  const w = $('#paletteWrap');
  w.hidden = false;
  w.innerHTML = `<div class="palette" role="dialog" aria-modal="true"><div class="p-input">${ic('command')}<input id="palInput" placeholder="${esc(t('p.placeholder'))}" autocomplete="off" spellcheck="false"><span class="kbd">Esc</span></div><div class="p-list" id="palList"></div></div>`;
  const input = $('#palInput');
  input.addEventListener('input', () => { palIndex = 0; renderPalette(); });
  input.addEventListener('keydown', (e) => {
    const n = $$('#palList .p-item').length;
    if (e.key === 'ArrowDown') { e.preventDefault(); palIndex = (palIndex + 1) % Math.max(n, 1); renderPalette(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); palIndex = (palIndex - 1 + n) % Math.max(n, 1); renderPalette(); }
    else if (e.key === 'Enter') { e.preventDefault(); runPalette(palIndex); }
  });
  w.onclick = (e) => { if (e.target === w) closePalette(); };
  renderPalette(); input.focus();
}
let palFiltered = [];
function renderPalette() {
  const q = ($('#palInput')?.value || '').toLowerCase().trim();
  palFiltered = commands().filter((c) => !q || q.split(/\s+/).every((w) => (c.label + ' ' + c.g).toLowerCase().includes(w)));
  let h = '', g = null;
  palFiltered.forEach((c, i) => {
    if (c.g !== g) { g = c.g; h += `<div class="p-group">${esc(g)}</div>`; }
    h += `<div class="p-item ${i === palIndex ? 'on' : ''}" data-action="pal-run" data-v="${i}">${ic(c.icon)}<span>${esc(c.label)}</span>${c.kbd ? `<span class="kbd">${c.kbd}</span>` : ''}</div>`;
  });
  $('#palList').innerHTML = h || `<div class="p-empty">${esc(t('p.empty'))}</div>`;
  $('#palList .p-item.on')?.scrollIntoView({ block: 'nearest' });
}
function runPalette(i) { const c = palFiltered[i]; closePalette(); if (c) c.run(); }
function closePalette() { state.palette = false; $('#paletteWrap').hidden = true; $('#paletteWrap').innerHTML = ''; }

/* ═════════════ Help ═════════════ */
function openHelp() {
  state.help = true;
  const k = (...keys) => keys.map((x) => `<span class="kbd">${x}</span>`).join('');
  const row = (label, keys) => `<div class="hk"><span>${esc(label)}</span><span>${keys}</span></div>`;
  const w = $('#helpWrap');
  w.hidden = false;
  w.innerHTML = `<div class="help" role="dialog" aria-modal="true"><div class="help-head"><h2>${esc(t('h.title'))}</h2><button class="icon-btn" data-action="help-close" aria-label="Close">${ic('x')}</button></div>
    <div class="help-grid"><div><h3>${esc(t('h.nav'))}</h3>${row(t('h.next'), k('J'))}${row(t('h.prev'), k('K'))}${row(t('h.open'), k('Enter'))}${row(t('h.back'), k('U'))}${row(t('h.search'), k('/'))}${row(t('h.palette'), k(MOD, 'K'))}${row(t('h.help'), k('?'))}${row(t('h.close'), k('Esc'))}</div>
    <div><h3>${esc(t('h.actions'))}</h3>${row(t('h.compose'), k('C'))}${row(t('h.reply'), k('R'))}${row(t('h.replyAll'), k('A'))}${row(t('h.forward'), k('F'))}${row(t('h.archive'), k('E'))}${row(t('h.delete'), k('#'))}${row(t('h.star'), k('S'))}${row(t('h.select'), k('X'))}${row(t('h.read'), k('Shift', 'I'))}${row(t('h.unread'), k('Shift', 'U'))}${row(t('h.send'), k(MOD, 'Enter'))}</div></div></div>`;
  w.onclick = (e) => { if (e.target === w) closeHelp(); };
}
function closeHelp() { state.help = false; $('#helpWrap').hidden = true; }

/* ═════════════ Navigation ═════════════ */
function goFolder(f) {
  state.folder = f; state.openId = null; state.cursorId = null; state.checked.clear();
  $('#app').classList.remove('drawer-open'); syncScrim();
  render();
  if (effLayout() !== 'off' && state.items[0]) openItem(state.items[0].id, { scroll: false });
}

/* ═════════════ Event wiring ═════════════ */
const ACTIONS = {
  open: (el) => openItem(el.dataset.id, { scroll: false }),
  check: (el) => { const id = el.dataset.id; state.checked.has(id) ? state.checked.delete(id) : state.checked.add(id); renderList(); },
  star: (el) => { const th = threadOf(el.dataset.th); th.starred = !th.starred; render(); },
  'row-archive': (el) => moveThreads([el.dataset.th], 'archive', 't.archived'),
  'row-delete': (el) => deleteThreads([el.dataset.th]),
  'row-snooze': (el) => moveThreads([el.dataset.th], 'snoozed', 't.snoozed'),
  'row-read': (el) => { const it = itemById(el.dataset.id); setRead([el.dataset.id], it.msgs.some((m) => m.unread)); },
  archive: (el) => moveThreads(threadsForAction(el), 'archive', 't.archived'),
  delete: (el) => deleteThreads(threadsForAction(el)),
  snooze: (el) => moveThreads(threadsForAction(el), 'snoozed', 't.snoozed'),
  restore: (el) => moveThreads(threadsForAction(el), 'inbox', 't.restored'),
  unread: () => setRead([state.openId], false),
  'select-all': () => { const all = state.items.map((i) => i.id); const every = all.length && all.every((id) => state.checked.has(id)); state.checked = new Set(every ? [] : all); renderList(); },
  bulk: (el) => {
    const ids = [...state.checked]; const ths = ids.map((id) => threadOf(id).id);
    ({ archive: () => moveThreads(ths, 'archive', 't.archived'), delete: () => deleteThreads(ths), snooze: () => moveThreads(ths, 'snoozed', 't.snoozed'),
       read: () => { setRead(ids, true); state.checked.clear(); renderList(); }, unread: () => { setRead(ids, false); state.checked.clear(); renderList(); } })[el.dataset.v]();
  },
  'bulk-clear': () => { state.checked.clear(); renderList(); },
  folder: (el) => goFolder(el.dataset.v),
  account: (el) => { state.account = el.dataset.v; goFolder('inbox'); },
  filter: (el) => { const f = el.dataset.v; state.filters.has(f) ? state.filters.delete(f) : state.filters.add(f); render(); },
  refresh: (el) => { el.classList.add('spin'); setTimeout(() => { el.classList.remove('spin'); toast(t('t.upToDate')); }, 700); },
  compose: () => openCompose(),
  reply: (el) => openCompose(quoteFor(el.dataset.v, 'reply')),
  replyAll: (el) => openCompose(quoteFor(el.dataset.v, 'replyAll')),
  forward: (el) => openCompose(quoteFor(el.dataset.v, 'forward')),
  expand: (el) => { state.expanded.add(el.dataset.v); renderReader(); },
  collapse: (el) => { state.expanded.delete(el.dataset.v); const it = itemById(el.dataset.v); if (it) it.msgs[0].unread = false; renderReader(); },
  'expand-all': (el) => { state.expanded.add(el.dataset.v + ':all'); renderReader(); },
  'show-images': (el) => { state.shownImages.add(el.dataset.v); renderReader(); },
  download: () => toast(t('t.download')),
  more: () => toast(prefs.lang === 'de' ? 'Labels & Verschieben kommen in der echten App' : 'Labels & move-to come in the real app'),
  nav: (el) => move(+el.dataset.v),
  back: () => closeReader(),
  menu: () => {
    if (isMobile()) { $('#app').classList.toggle('drawer-open'); syncScrim(); }
    else setPref('sidebarCollapsed', !prefs.sidebarCollapsed);
  },
  scrim: () => { $('#app').classList.remove('drawer-open'); closeSettings(); },
  'settings-open': openSettings,
  'settings-close': closeSettings,
  set: (el) => setPref(el.dataset.k, el.dataset.v),
  toggle: (el) => setPref(el.dataset.k, !prefs[el.dataset.k]),
  reset: () => { const keep = { tipDismissed: true }; prefs = { ...DEFAULTS, ...keep }; savePrefs(); render(); },
  'theme-toggle': () => setPref('mode', document.documentElement.dataset.mode === 'dark' ? 'light' : 'dark'),
  help: openHelp,
  'help-close': closeHelp,
  palette: openPalette,
  'pal-run': (el) => runPalette(+el.dataset.v),
  'clear-search': () => { const s = $('#search'); s.value = ''; state.search = ''; $('#clearSearch').hidden = true; render(); s.focus(); },
  'toast-undo': () => { $('#toast').classList.remove('show'); const u = toastUndo; toastUndo = null; u && u(); },
  'toast-close': () => $('#toast').classList.remove('show'),
  'tip-close': () => { prefs.tipDismissed = true; savePrefs(); $('#tipHost').innerHTML = ''; },
  'tip-settings': () => { ACTIONS['tip-close'](); openSettings(); },
  'c-head': (el) => { const c = el.closest('.compose'); if (c.classList.contains('min')) { c.classList.remove('min'); } },
  'c-min': (el) => { const c = el.closest('.compose'); c.classList.remove('max'); c.classList.toggle('min'); },
  'c-max': (el) => { const c = el.closest('.compose'); c.classList.remove('min'); c.classList.toggle('max'); },
  'c-close': (el) => {
    const c = el.closest('.compose'); const d = composeData(c); c.remove();
    if (d.to || d.subject || c.querySelector('.c-body').innerText.trim()) toast(t('t.saved'));
  },
  'c-discard': (el) => { const c = el.closest('.compose'); const d = composeData(c); c.remove(); toast(t('t.discarded'), () => openCompose(d)); },
  'c-send': (el) => sendCompose(el.closest('.compose')),
  'c-fmt': (el) => {
    const cmd = el.dataset.v; el.closest('.compose').querySelector('.c-body').focus();
    if (cmd === 'createLink') { const url = prompt('URL', 'https://'); if (url) document.execCommand('createLink', false, url); }
    else document.execCommand(cmd);
  },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) { if (el.tagName === 'BUTTON' || el.tagName === 'A') e.preventDefault(); fn(el, e); }
});
document.addEventListener('mousedown', (e) => { if (e.target.closest('[data-action="c-fmt"]')) e.preventDefault(); });

const searchEl = $('#search');
searchEl.addEventListener('input', () => { state.search = searchEl.value; $('#clearSearch').hidden = !searchEl.value; state.checked.clear(); renderList(); });
searchEl.addEventListener('keydown', (e) => { if (e.key === 'Escape') { ACTIONS['clear-search'](); searchEl.blur(); } if (e.key === 'Enter' || e.key === 'ArrowDown') { searchEl.blur(); move(0); } });

document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); state.palette ? closePalette() : openPalette(); return; }
  const compose = e.target.closest?.('.compose');
  if (compose && mod && e.key === 'Enter') { e.preventDefault(); sendCompose(compose); return; }
  if (e.key === 'Escape') {
    if (state.help) return closeHelp();
    if (state.palette) return closePalette();
    if (state.settings) return closeSettings();
    if ($('#app').classList.contains('drawer-open')) { $('#app').classList.remove('drawer-open'); return syncScrim(); }
    const max = $('.compose.max'); if (max) return max.classList.remove('max');
    if (compose) return;
    if (state.checked.size) { state.checked.clear(); return renderList(); }
    if (state.openId && effLayout() === 'off') return closeReader();
    return;
  }
  if (state.palette || state.help) return;
  if (e.target.closest('input, textarea, select, [contenteditable="true"]') || mod || e.altKey) return;
  const cur = state.openId || state.cursorId;
  const keyMap = {
    j: () => move(1), k: () => move(-1), ArrowDown: () => move(1), ArrowUp: () => move(-1),
    Enter: () => { if (state.cursorId && !state.openId) openItem(state.cursorId); }, o: () => state.cursorId && openItem(state.cursorId),
    u: () => effLayout() === 'off' ? closeReader() : null,
    e: () => cur && moveThreads([threadOf(cur).id], 'archive', 't.archived'),
    '#': () => cur && deleteThreads([threadOf(cur).id]),
    Delete: () => cur && deleteThreads([threadOf(cur).id]),
    s: () => { if (cur) { const th = threadOf(cur); th.starred = !th.starred; render(); } },
    x: () => { if (cur) { state.checked.has(cur) ? state.checked.delete(cur) : state.checked.add(cur); renderList(); } },
    r: () => { const k = replyKeyFromOpen(); k && openCompose(quoteFor(k, 'reply')); },
    a: () => { const k = replyKeyFromOpen(); k && openCompose(quoteFor(k, 'replyAll')); },
    f: () => { const k = replyKeyFromOpen(); k && openCompose(quoteFor(k, 'forward')); },
    c: () => openCompose(),
    '/': () => searchEl.focus(),
    '?': () => openHelp(),
    I: () => cur && setRead([cur], true),
    U: () => cur && setRead([cur], false),
  };
  const fn = keyMap[e.key];
  if (fn) { e.preventDefault(); fn(); }
});

/* Divider drag (resizable panes) */
$('#divider').addEventListener('pointerdown', (e) => {
  const lay = $('#main').dataset.layout;
  if (lay === 'off') return;
  const div = e.currentTarget; div.setPointerCapture(e.pointerId);
  document.body.classList.add('resizing'); document.body.classList.toggle('rows', lay === 'below');
  const mainRect = $('#main').getBoundingClientRect(), listRect = $('#listPane').getBoundingClientRect();
  const onMove = (ev) => {
    if (lay === 'right') {
      let w = prefs.rtl ? listRect.right - ev.clientX : ev.clientX - listRect.left;
      w = Math.round(Math.max(300, Math.min(w, mainRect.width - 380)));
      prefs.listW = w; document.documentElement.style.setProperty('--list-w', w + 'px');
    } else {
      let h = ((ev.clientY - mainRect.top) / mainRect.height) * 100;
      h = Math.round(Math.max(22, Math.min(h, 75)));
      prefs.listH = h; document.documentElement.style.setProperty('--list-h', h + '%');
    }
  };
  const onUp = () => { div.removeEventListener('pointermove', onMove); div.removeEventListener('pointerup', onUp); document.body.classList.remove('resizing', 'rows'); savePrefs(); };
  div.addEventListener('pointermove', onMove); div.addEventListener('pointerup', onUp);
});
$('#divider').addEventListener('dblclick', () => { prefs.listW = 420; prefs.listH = 44; savePrefs(); applyPrefs(); });

mqDark.addEventListener('change', () => { if (prefs.mode === 'system') render(); });
matchMedia('(max-width: 720px)').addEventListener('change', () => {
  $('#app').classList.remove('drawer-open'); syncScrim(); render();
  if (!state.openId && effLayout() !== 'off' && state.items[0]) openItem(state.items[0].id, { scroll: false });
});

/* ═════════════ Boot ═════════════ */
$$('[data-ic]').forEach((el) => { el.outerHTML = ic(el.dataset.ic); });
render();
if (effLayout() !== 'off' && state.items[0]) openItem(state.items[0].id, { scroll: false });
if (!prefs.tipDismissed) {
  $('#tipHost').innerHTML = `<div class="tip" role="note"><b>${esc(t('tip.title'))}</b><p>${esc(t('tip.body', { k: MOD + 'K' }))}</p>
    <div class="row-btns"><button class="btn" data-action="tip-close">${esc(t('tip.ok'))}</button><button class="btn primary" data-action="tip-settings">${esc(t('tip.settings'))}</button></div></div>`;
}
// Simulated push: a new message arrives after a short while (like JMAP push / IMAP IDLE).
setTimeout(() => {
  const th = normalize({ id: 'live1', account: 'work', folder: 'inbox', labels: ['work'], subject: 'Lunch today?', messages: [
    { from: ppl.priya, to: ['me'], date: new Date(), unread: true, body: P('Hey Sam! A few of us are getting ramen at 12:30 — want to join? 🍜', 'Priya') },
  ] });
  threads.push(th);
  render();
  document.querySelector('.row[data-id="live1"]')?.classList.add('arrive');
  toast(t('t.newMail', { x: 'Priya Nair' }));
}, 20000);
</script>
